# Weekly update checks for the Rust dependencies and the pinned GitHub Actions.
# Security updates are separate and are switched on in the repository settings
# (see docs/repository-settings.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
