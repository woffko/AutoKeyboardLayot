name: Build and compatibility checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: "1"
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -- --test-threads=1
      - run: cargo test --locked --no-default-features -- --test-threads=1
      - run: cargo clippy --locked --no-default-features --features installer-tools --all-targets -- -D warnings
      - run: cargo run --locked --example validate_locales -- data/package-locales --require-complete
      - run: python -m unittest discover -s tools -p "test_*.py"
      - run: cargo build --locked --release --no-default-features --features installer-tools --bins
      - name: Dependency advisories
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Verify previously published packages with the new consumer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --no-default-features --example verify_language_package
          directory=$(mktemp -d)
          trap 'rm -rf "$directory"' EXIT
          for asset in ar-SA-r1 bn-BD-r1 de-DE-r1 es-ES-r1 et-EE-r2 fr-FR-r1 hi-IN-r1 id-ID-r1 ja-JP-r1 pt-BR-r1 ru-RU-r3 ur-PK-r1 zh-CN-r1; do
            curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 67108864 "https://github.com/woffko/AutoKeyboardLayot/releases/download/lang-r4-20260916/$asset.aklp" --output "$directory/$asset.aklp"
            target/debug/examples/verify_language_package "$directory/$asset.aklp"
          done
